[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"
    Cache-Control = "public, max-age=604800"

# ---- 37 Days (July 1914 simulation) ----
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The site is published from the repository root, so block everything that must never be served
# as a static file: the function sources (briefings, teacher notes), tests and package files.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/37-days/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
